schema = 1

[identity]
name = "Cortetsu"
concept = "transformation under pressure"

[palette]
sumi = "#0B0D10"
tetsu = "#171B21"
washi = "#E7E0D5"
indigo = "#334E68"
vermillion = "#D64B32"
muted = "#8A919B"

[palette.semantic]
surface_high = "#222831"
primary_container = "#263E53"
secondary = "#526D82"
secondary_container = "#293B4A"
outline_variant = "#505862"
scrim = "#0B0D10"
# Indigo lifted to 3:1 on every surface for focus rings, tracks and fills.
indicator = "#5F7FA0"
surface_glass = "#1B2028"
surface_glass_strong = "#202731"
on_surface_muted = "#AAB1BA"
success = "#7A9B83"
warning = "#C49A62"

[shape]
radius_small = 8
radius_medium = 12
radius_large = 20
radius_surface = 28
radius_pill = 999

[spacing]
unit = 4
compact = 8
standard = 12
comfortable = 16
spacious = 24
section = 32

[density]
control_height = 36
row_height = 52
control_height_primary = 40
outline_width = 1
overlay_opacity = 0.94
scrim_opacity = 0.22

[motion]
instant_ms = 80
fast_ms = 120
standard_ms = 180
deliberate_ms = 240
panel_ms = 320
drawer_ms = 400
tooltip_ms = 150
# First tooltip waits this long; the next ones open at once (see tooltipWarmUntil).
tooltip_delay_ms = 240
popover_ms = 200
# Exits are shorter than entries.
popover_exit_ms = 150
panel_exit_ms = 240
# Launcher and Overview open from a key: a short fade, nothing moves.
summon_ms = 140
summon_exit_ms = 100
hover_scale = 1.025
press_scale = 0.97
# Cubic-bezier control points (x1, y1, x2, y2).
ease_out = [0.23, 1, 0.32, 1]
ease_in_out = [0.77, 0, 0.175, 1]
ease_drawer = [0.32, 0.72, 0, 1]

[wall_utility]
surface_radius = "shape.radius_surface"
panel_motion = "motion.panel_ms"
orbit_motion = "motion.standard_ms"
crossfade_motion = "motion.standard_ms"
orbit_top_gap = "spacing.section"
orbit_bottom_gap = "spacing.section"
footer_gap = "spacing.compact"
category_gap = "spacing.compact"

[principles]
space = "ma"
material = "sumi-tetsu-washi"
accent = "vermillion"
accent_policy = "indigo-for-interaction-vermillion-for-danger"
success_policy = "healthy-connected-success-only"
