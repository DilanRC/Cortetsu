# Managed by Cortetsu (dotfiles/home/.config/hypr/xdph.conf).
# xdg-desktop-portal-hyprland 1.4.1 asks the Cortetsu share picker for every
# screencast. The helper falls back to hyprland-share-picker when no shell runs.
screencopy {
    custom_picker_binary = cortetsu-share-picker
    # A remembered choice ("Recordar para esta app") yields a restore token,
    # so Chromium/Electron do not ask again on their next request.
    allow_token_by_default = true
}
