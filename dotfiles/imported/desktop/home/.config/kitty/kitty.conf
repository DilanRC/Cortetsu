include cortetsu-theme.conf
# Live scheme colours, written outside the sealed generation by cortetsu-scheme.
# If the file is missing Kitty logs it and keeps the ui.toml palette above.
include ~/.local/state/cortetsu/kitty-colors.conf

# Deja ver Hyprglass sin que el wallpaper entre demasiado limpio.
background_opacity 0.35
dynamic_background_opacity yes

# Control local para que el atajo global pueda abrir tabs en la ventana actual.
allow_remote_control socket-only
listen_on unix:@kitty-rice

# Tabs arriba para trabajar en una sola instancia de Kitty.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_title_template "{index}: {title}"

# Layouts internos: tabs para contextos, splits cuando haga falta dividir una tab.
enabled_layouts splits,tall,stack

# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9

# Ventanas/splits dentro de la tab actual
map ctrl+shift+enter new_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+f move_window_forward
map ctrl+shift+b move_window_backward
map ctrl+shift+r start_resizing_window
map ctrl+shift+space next_layout

font_family JetBrainsMono Nerd Font
font_size 14
