schema = 1

[group.core]
required = true
packages = ["git", "python", "util-linux"]
commands = ["git", "python3", "bash", "flock", "systemctl"]

[group.shell]
required = true
packages = ["hyprland", "quickshell-git"]
commands = ["hyprctl", "qs"]

# «Atajos y teclados»: the Rust helper is built at install time; at run time
# it reads keymaps with xkbcli, hotplug with udevadm and ties udevadm to its
# own life with setpriv (util-linux, in core).
[group.keyboards]
required = true
packages = ["rust", "libxkbcommon", "systemd"]
commands = ["cargo", "xkbcli", "udevadm", "setpriv"]

[group.personal-shell]
required = true
packages = ["fish"]
commands = ["fish"]

[group.desktop-integrations]
required = false
packages = ["networkmanager", "pipewire", "wireplumber", "libsecret", "power-profiles-daemon"]
commands = ["nmcli", "wpctl", "secret-tool", "powerprofilesctl"]

[group.optional-tools]
required = false
packages = ["clipse", "ddcutil"]
commands = ["clipse", "ddcutil"]

[group.wallpaper-colours]
required = false
packages = ["imagemagick", "python-materialyoucolor"]
commands = ["magick", "python3"]
