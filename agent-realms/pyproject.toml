[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortetsu-agent-realms"
version = "0.1.0"
description = "Isolated headless Hyprland sessions for desktop agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
agent-realm = "cortetsu_agent_realms.cli:main"
agent-realm-mcp = "cortetsu_agent_realms.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
