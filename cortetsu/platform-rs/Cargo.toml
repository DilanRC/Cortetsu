[package]
name = "cortetsu-platform"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
fs2 = "0.4"
toml = "0.8"
regex = "1"
cortetsu-rescue = { path = "../rescue" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
