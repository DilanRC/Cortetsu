[package]
name = "cortetsu-hardware-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
signal-hook = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
fs2 = "0.4"
regex = "1"
nix = { version = "0.30", features = ["user", "fs", "process", "signal", "feature"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "cortetsu-hardware-runtime"
path = "src/main.rs"
