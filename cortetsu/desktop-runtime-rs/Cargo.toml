[package]
name = "cortetsu-desktop-runtime"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fs2 = "0.4"
sha2 = "0.10"
regex = "1"
chrono = "0.4"
signal-hook = "0.3"
nix = { version = "0.30", features = ["signal", "process", "user", "poll", "time"] }
ureq = { version = "2.12", features = ["json"] }
url = "2"
base64 = "0.22"
zbus = "5"
material-colors = { version = "0.4", features = ["serde"] }
shell-words = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
