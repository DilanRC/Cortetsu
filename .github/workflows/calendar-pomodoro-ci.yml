name: Cortetsu QML and native installation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    # Quickshell and Qt must come from the same distribution build.
    container: archlinux:latest
    steps:
      - name: Install cloud test dependencies
        run: |
          pacman -Syu --noconfirm base-devel git python nodejs qt6-declarative quickshell rust go libxkbcommon dbus weston libnotify noto-fonts fontconfig ttf-material-symbols-variable
          # A minimal Arch image has no fonts; Qt then measures missing glyphs
          # at one em each, which is not a usable desktop text environment.
          cortetsu_test_font="$(fc-match --format='%{file}' Rubik)"
          test -n "$cortetsu_test_font"
          test -r "$cortetsu_test_font"
          fc-match Rubik
          # fc-match silently returns Noto for an absent font. Verify the
          # icon family instead of accepting a readable fallback.
          icon_family="$(fc-match --format='%{family[0]}' 'Material Symbols Rounded')"
          case "$icon_family" in
            *"Material Symbols Rounded"*) echo "Material Symbols Rounded: $icon_family" ;;
            *) echo "::error::Required icon font not resolved: $icon_family" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Trust the fixture repository for git
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache/restore@v5
        id: native-cache
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            cortetsu/*/target
          key: native-arch-${{ hashFiles('cortetsu/**/Cargo.lock') }}
      - name: Start an isolated runner system bus
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
      - name: Build the native runtime
        id: native-build
        run: scripts/build-native.sh
      - name: Preserve successful native build for QML diagnostics
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            cortetsu/*/target
          key: native-arch-${{ hashFiles('cortetsu/**/Cargo.lock') }}
      - name: Parse the actual bridge and automation settings
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          /usr/lib/qt6/bin/qmlformat cortetsu/modules/CortetsuPolicyBridge.qml > /dev/null
          /usr/lib/qt6/bin/qmlformat cortetsu/modules/settings/sections/AutomationSection.qml > /dev/null
          # Parse the complete QML source inventory, including Quickshell's
          # compatibility base, rather than only Settings and shared controls.
          parsed=0
          while IFS= read -r -d '' source; do
            /usr/lib/qt6/bin/qmlformat "$source" >/dev/null || {
              echo "::error file=$source::QML parser failed"
              exit 1
            }
            parsed=$((parsed + 1))
          done < <(find cortetsu -type f -name '*.qml' -print0)
          echo "Parsed $parsed QML files"
          QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input cortetsu/tests/qml/policy
      - name: Real Qt Quick Test for shared controls, focus and Settings
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          for group in components focus settings hardware hypr keyboards surfaces calendar pomodoro bottomhub; do
            echo "::group::Qt Quick Test $group"
            QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input "cortetsu/tests/qml/$group"
            echo "::endgroup::"
          done
          QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input cortetsu/modules/wallpaper/tests
      - name: Native installation with no Python on child PATH
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: python3 scripts/features/test-cortetsu-build.py --native-bundle dist/native
      - name: Real QML coordinator lifecycle and readback
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: dbus-run-session -- python3 scripts/features/test-cortetsu-v2-bridge-runtime.py
      - name: Real notification owner and concurrent history changes
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: python3 scripts/features/test-notification-history-runtime.py
      - name: Credential failure and cancellation stay uncommitted
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: dbus-run-session -- python3 scripts/features/test-connectivity-credential-flow.py
      - name: Actual Settings pages, activation controls and keyboard input
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        env:
          CORTETSU_RENDER_DIR: ${{ runner.temp }}/cortetsu-settings-renders
        run: |
          mkdir -p "$CORTETSU_RENDER_DIR"
          dbus-run-session -- python3 scripts/features/test-cortetsu-settings-runtime.py
      - name: Keep synthetic Settings render evidence
        if: ${{ always() && steps.native-build.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: cortetsu-settings-qt-renders
          path: ${{ runner.temp }}/cortetsu-settings-renders/
          if-no-files-found: warn
          retention-days: 7
