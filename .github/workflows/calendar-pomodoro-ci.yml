name: Cortetsu QML and native installation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    # Quickshell and Qt must come from the same distribution build.
    container: archlinux:latest
    steps:
      - name: Install cloud test dependencies
        run: pacman -Syu --noconfirm base-devel git python nodejs qt6-declarative quickshell rust go libxkbcommon dbus weston libnotify
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Trust the fixture repository for git
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            cortetsu/*/target
          key: native-arch-${{ hashFiles('cortetsu/**/Cargo.lock') }}
      - name: Start an isolated runner system bus
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
      - name: Build the native runtime
        run: scripts/build-native.sh
      - name: Parse the actual bridge and automation settings
        run: |
          /usr/lib/qt6/bin/qmlformat cortetsu/modules/CortetsuPolicyBridge.qml > /dev/null
          /usr/lib/qt6/bin/qmlformat cortetsu/modules/settings/sections/AutomationSection.qml > /dev/null
          QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input cortetsu/tests/qml/policy
      - name: Native installation with no Python on child PATH
        run: python3 scripts/features/test-cortetsu-build.py --native-bundle dist/native
      - name: Real QML coordinator lifecycle and readback
        run: dbus-run-session -- python3 scripts/features/test-cortetsu-v2-bridge-runtime.py
      - name: Real notification owner and concurrent history changes
        run: python3 scripts/features/test-notification-history-runtime.py
      - name: Credential failure and cancellation stay uncommitted
        run: dbus-run-session -- python3 scripts/features/test-connectivity-credential-flow.py
      - name: Actual Settings pages, activation controls and keyboard input
        run: dbus-run-session -- python3 scripts/features/test-cortetsu-settings-runtime.py
