name: Calendar, Pomodoro and runtime

on:
  push:
    branches:
      - main
      - feature/cortetsu-v2-modernize
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The runtime build runs Qt Quick Test and Quickshell fixtures; Ubuntu
    # packages neither Quickshell nor a matching Qt, Arch ships both.
    container: archlinux:latest
    steps:
      - name: Install runtime test dependencies
        run: pacman -Syu --noconfirm git python nodejs qt6-declarative quickshell
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      # The build test isolates HOME, so the per-user safe.directory written
      # by checkout is not visible to the git calls it makes.
      - name: Trust the workspace for git
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            cortetsu/bin/cortetsu-calendar \
            cortetsu/bin/cortetsu-pomodoro \
            cortetsu/bin/compose-panels.py \
            cortetsu/tests/test-calendar-credentials.py \
            cortetsu/tests/test-calendar-polish.py \
            cortetsu/tests/test-pomodoro.py \
            cortetsu/tests/test-runtime-contract.py \
            scripts/features/test-cortetsu-build.py
      - name: Validate shell scripts
        run: |
          bash -n cortetsu/bin/build-runtime.sh
          bash -n cortetsu/bin/install-patches.sh
          bash -n cortetsu/bin/install.sh
          bash -n cortetsu/bin/rollback-runtime.sh
          bash -n scripts/install-cortetsu.sh
          bash -n scripts/migrate-cortetsu-v2.sh
      - name: Run unit and contract tests
        run: |
          python3 cortetsu/tests/test-calendar-credentials.py
          bash cortetsu/tests/test-calendar-readonly.sh
          python3 cortetsu/tests/test-calendar-polish.py
          python3 cortetsu/tests/test-pomodoro.py
          python3 cortetsu/tests/test-runtime-contract.py
      - name: Validate Ascension launcher contracts
        run: |
          python3 scripts/features/test-cortetsu-launcher.py
          python3 scripts/features/test-launcher-fonts.py
          python3 scripts/features/test-launcher-process-scope.py
      - name: Validate Ascension overview and display contracts
        run: |
          python3 scripts/features/test-overview-design.py
          python3 scripts/features/test-overview-popout-exclusivity.py
          python3 scripts/features/test-display-design.py
          python3 scripts/features/test-display-primary.py
      - name: Validate Ascension hardware and shell contracts
        run: |
          python3 scripts/features/test-hardware-design.py
          python3 scripts/features/test-cortetsu-quality.py
          python3 scripts/features/test-native-bottom-hub.py
          python3 scripts/features/test-native-theme.py
      # Quickshell's network module probes the system bus at startup and logs
      # a warning without one; the connectivity fixtures reject warnings.
      - name: Start a system D-Bus
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
      - name: Build two isolated generations and roll back
        run: python3 scripts/features/test-cortetsu-build.py
