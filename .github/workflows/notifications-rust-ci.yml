name: Cortetsu notifications Rust migration parity

on:
  push:
    paths:
      - 'cortetsu/notification-helper/**'
      - 'cortetsu/bin/cortetsu-notifications'
      - '.github/workflows/notifications-rust-ci.yml'
  pull_request:
    paths:
      - 'cortetsu/notification-helper/**'
      - 'cortetsu/bin/cortetsu-notifications'
      - '.github/workflows/notifications-rust-ci.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Verify committed Rust formatting
        working-directory: cortetsu/notification-helper
        run: cargo fmt --all -- --check
      - name: Lint
        working-directory: cortetsu/notification-helper
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        working-directory: cortetsu/notification-helper
        run: cargo test --locked --all-targets
      - name: Build opt-in binary
        working-directory: cortetsu/notification-helper
        run: cargo build --locked --release
      - name: Match existing Python helper with isolated state
        run: python3 cortetsu/notification-helper/tests/parity.py
      - uses: actions/upload-artifact@v4
        with:
          name: cortetsu-notifications-rs-parity-candidate-linux-amd64
          path: cortetsu/notification-helper/target/release/cortetsu-notifications-rs
          retention-days: 14
