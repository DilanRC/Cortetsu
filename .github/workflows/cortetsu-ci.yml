name: Cortetsu static validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Validate repository whitespace
        run: git diff --check HEAD^ HEAD
      - name: Install Lua for the actual Hyprland module-loading fixture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Validate native packages, launchers and frozen reference hashes
        run: python3 scripts/verification/test-native-source.py
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find scripts cortetsu/bin -type f -name '*.sh' -print0)
          bash -n scripts/cortetsu
          for file in cortetsu/bin/cortetsu-*; do
            if head -n 1 "$file" | grep -q bash; then bash -n "$file"; fi
          done
      - name: Validate preserved UI and shortcut contracts
        run: |
          python3 scripts/features/test-cortetsu-quality.py
          python3 scripts/features/test-native-bottom-hub.py
          python3 scripts/features/test-cortetsu-dashboard-typography.py
          python3 scripts/features/eval-cortetsu-dashboard-typography.py
          python3 scripts/features/test-cortetsu-tray-menu.py
          python3 scripts/features/eval-cortetsu-tray-menu.py
          python3 scripts/features/test-hyprland-self-contained.py
          python3 scripts/features/test-zero-caelestia-gate.py
          python3 scripts/features/test-shortcut-namespace.py
          python3 scripts/features/test-cortetsu-settings.py
          python3 scripts/features/test-cortetsu-v2-bridge.py
          python3 cortetsu/tests/test-startup-inventory.py
      - name: Validate policy and notification reconciliation models
        run: |
          node scripts/features/test-cortetsu-policy-model.mjs
          node scripts/features/test-notification-reconcile.mjs
      - name: Keep QML commands structured
        run: '! git grep -n -I "sh -c" -- "cortetsu/**/*.qml"'

  wall-utility-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile Wall Utility checks
        run: |
          python3 -m py_compile \
            scripts/features/test-cortetsu-wall-utility-contract.py \
            scripts/features/eval-cortetsu-wall-utility-contract.py
      - name: Validate Wall Utility BCDE contract
        run: |
          python3 scripts/features/test-cortetsu-wall-utility-contract.py
          python3 scripts/features/eval-cortetsu-wall-utility-contract.py
          python3 scripts/features/test-cortetsu-launcher-wallpaper-apply.py
          python3 scripts/features/eval-cortetsu-launcher-wallpaper-apply.py
