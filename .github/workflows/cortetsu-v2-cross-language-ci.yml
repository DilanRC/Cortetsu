name: Cortetsu native end-to-end
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ipc-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: cortetsu/protocol/go.sum
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cortetsu/*/target
          key: bundle-${{ runner.os }}-${{ hashFiles('cortetsu/**/Cargo.lock') }}
      - name: Build the complete generation-ready bundle
        run: scripts/build-native.sh
      - name: Real Go to Rust verification and failure propagation
        run: |
          python3 scripts/features/test-cortetsu-cross-language-ipc.py \
            --bridge dist/native/cortetsu-bridge --rescue dist/native/cortetsu-rescue
      - name: Real consent, CAS, manual override, audit and crash reconnect
        run: python3 scripts/verification/test-active-policy.py
      - name: Preserve executable modes in the downloadable bundle
        run: tar -C dist -czf dist/cortetsu-native-linux-amd64.tar.gz native
      - uses: actions/upload-artifact@v4
        with:
          name: cortetsu-native-linux-amd64
          path: dist/cortetsu-native-linux-amd64.tar.gz
          retention-days: 14
