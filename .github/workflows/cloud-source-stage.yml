name: Cortetsu tracked-source snapshot
on:
  push:
    paths:
      - '.github/workflows/cloud-source-stage.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Archive tracked sources
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/cortetsu-tracked.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: cortetsu-stage-source
          path: ${{ runner.temp }}/cortetsu-tracked.tar.gz
          retention-days: 1
