name: Cortetsu display presets Rust migration parity

on:
  push:
    paths:
      - 'cortetsu/display-presets-rs/**'
      - 'cortetsu/bin/cortetsu-display-presets'
      - '.github/workflows/display-presets-rust-ci.yml'
  pull_request:
    paths:
      - 'cortetsu/display-presets-rs/**'
      - 'cortetsu/bin/cortetsu-display-presets'
      - '.github/workflows/display-presets-rust-ci.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Verify committed format
        working-directory: cortetsu/display-presets-rs
        run: cargo fmt --all -- --check
      - name: Lint and unit tests
        working-directory: cortetsu/display-presets-rs
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Build opt-in helper
        working-directory: cortetsu/display-presets-rs
        run: cargo build --locked --release
      - name: Compare against Python in isolated homes
        run: python3 cortetsu/display-presets-rs/tests/parity.py
      - uses: actions/upload-artifact@v4
        with:
          name: cortetsu-display-presets-rs-candidate-amd64
          path: cortetsu/display-presets-rs/target/release/cortetsu-display-presets-rs
          retention-days: 14
