name: Cortetsu coordinator and IPC
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: cortetsu/protocol/go.sum
      - name: Install private D-Bus test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dbus
      - name: Format
        working-directory: cortetsu/protocol
        run: test -z "$(gofmt -l .)"
      - name: Race detection, sessions, native D-Bus and activation contracts
        working-directory: cortetsu/protocol
        run: go test -race ./...
      - name: Require zero first-party Python runtime paths and invocations
        working-directory: cortetsu/protocol
        run: go run ./cmd/cortetsu-python-inventory --repo ../.. --require-native > native-inventory.json
      - name: Static analysis
        working-directory: cortetsu/protocol
        run: go vet ./...
      - name: Build all coordinator commands
        working-directory: cortetsu/protocol
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for command in cortetsu-shadow cortetsu-bridge cortetsu-coordinator cortetsu-policy cortetsu-python-inventory; do
            go build -trimpath -ldflags='-s -w' -o "dist/$command" "./cmd/$command"
          done
      - name: Deterministic shadow fixture
        working-directory: cortetsu/protocol
        run: |
          ./dist/cortetsu-shadow -rules fixtures/rules.json < fixtures/trace.ndjson > out.jsonl
          cmp out.jsonl fixtures/expected.jsonl
      - uses: actions/upload-artifact@v6
        with:
          name: cortetsu-native-python-inventory
          path: cortetsu/protocol/native-inventory.json
          retention-days: 14
