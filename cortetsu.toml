schema = 4

[project]
name = "Cortetsu"
kind = "dotfiles-platform"
stage = "unified-system-generations"
source_of_truth = "git-main"
platforms = ["CachyOS", "Arch Linux"]

[identity]
origin = "Coined from Cortés + tetsu (iron)."
style = "samurai-inspired, restrained, technical"
canonical_command = "cortetsu"

[stack]
compositor = "Hyprland"
shell_base = "Caelestia"
widgets = "Quickshell"

[upstream.caelestia]
package = "caelestia-shell"
installed_version = "2.4.0-1"
tag = "v2.4.0"
commit = "24aa15eefdb146350d2548c0a015b04eddbd1008"
package_runtime = "/etc/xdg/quickshell/caelestia"
role = "temporary-shell-adapter"

[runtime]
mode = "versioned-user-generations"
current = "~/.config/quickshell/cortetsu/current"
previous = "~/.config/quickshell/cortetsu/previous"
generations = "~/.local/share/cortetsu/builds"
package_runtime_policy = "read-only"

[dotfiles]
manifest = "dotfiles/manifest.toml"
default_profile = "personal"
current = "~/.local/share/cortetsu/dotfiles/current"
previous = "~/.local/share/cortetsu/dotfiles/previous"
generations = "~/.local/share/cortetsu/dotfiles/builds"
strategy = "build-hash-backup-promote-verify"

[system]
current = "~/.local/share/cortetsu/system/current"
previous = "~/.local/share/cortetsu/system/previous"
generations = "~/.local/share/cortetsu/system/builds"
components = ["shell", "dotfiles"]
rollback = "coordinated-compensating-transaction"

[packages]
platform = "arch"
manifest = "packages/arch.toml"
auto_install = false

[compatibility]
active_legacy = false
history_only = true

[entrypoints]
cli = "scripts/cortetsu"
installer = "scripts/cortetsu install"
static_tests = "scripts/cortetsu test"
runtime_verification = "scripts/cortetsu verify"
audit = "scripts/cortetsu audit"
doctor = "scripts/cortetsu doctor"
plan = "scripts/cortetsu plan"
rollback = "scripts/cortetsu rollback"
generations = "scripts/cortetsu generations"

[product]
current_modules = ["bottom-hub", "overview", "clipboard", "hardware", "display", "wallpaper", "calendar", "pomodoro"]
retired_modules = ["gaming-center", "updater"]
owned_layers = ["packages", "dotfiles", "profiles", "themes", "generations", "services", "actions", "scenes"]

[product.wall_utility]
contract = "cortetsu/contracts/wall-utility.json"
config = "dotfiles/home/.config/cortetsu/ui.toml"
preferences = "XDG config file cortetsu/preferences.json"

[safety]
write_strategy = "build-validate-promote-verify"
allow_secrets_in_git = false
allow_blind_upstream_overwrite = false
require_capability_detection = true
require_real_runtime_verification = true
